<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dusit Daily</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0e1524">
<meta name="description" content="งานที่ต้องทำต่อของ Front Office ประจำวัน: คุยกับ Dusit Help ติ๊กงานเสร็จ สรุปส่งไลน์">
<meta name="apple-mobile-web-app-title" content="Dusit Daily">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first handover board. A deep "night" summary card with gold progress on top,
   open items grouped by department as room tiles, glass night pill nav with a gold centre button
   that fans out quick actions.
   BRAND: change --gold / --gold-hi / --night here to match the hotel's brand guideline. */
:root{
  --gold:#b08a4f; --gold-hi:#dcc08d; --gold-ink:#8a6a35; --gold-soft:#f3ead9;
  --night:#0e1524; --night-2:#1b2438; --night-ink:#c9d0de;
  --bg:#f4f4f2; --card:#ffffff; --ink:#151821; --muted:#6c7280; --line:#e7e6e1;
  --red:#d9473b; --red-ink:#b42318; --red-soft:#fbeae8;
  --amber:#e08a00; --amber-ink:#a35f00; --amber-soft:#fdf1dc;
  --green:#1f9d7a; --green-soft:#e2f4ee;
  --scrim:rgba(14,21,36,.55); --shadow:0 1px 2px rgba(14,21,36,.04),0 8px 24px rgba(14,21,36,.06);
  --c-done:#3d6fc4; --c-open:#d9473b;
  --f-display:"Anuphan","IBM Plex Sans Thai Looped",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai Looped","Noto Sans Thai",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --gold:#c9a46a; --gold-hi:#e6cc9b; --gold-ink:#e0c28c; --gold-soft:#2e2718;
  --night:#121a2b; --night-2:#1f2a41; --night-ink:#c9d0de;
  --bg:#0a0d13; --card:#141922; --ink:#eef0f4; --muted:#8f97a6; --line:#242b37;
  --red:#ff6a5c; --red-ink:#ff8a7e; --red-soft:#3a1b18; --amber:#f5a524; --amber-ink:#f5b54a; --amber-soft:#35290f;
  --green:#3cc39c; --green-soft:#11322a; --scrim:rgba(0,0,0,.62); --shadow:0 1px 2px rgba(0,0,0,.3);
  --c-done:#5f8fe0; --c-open:#ec5a4c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --gold:#c9a46a; --gold-hi:#e6cc9b; --gold-ink:#e0c28c; --gold-soft:#2e2718;
  --night:#121a2b; --night-2:#1f2a41; --night-ink:#c9d0de;
  --bg:#0a0d13; --card:#141922; --ink:#eef0f4; --muted:#8f97a6; --line:#242b37;
  --red:#ff6a5c; --red-ink:#ff8a7e; --red-soft:#3a1b18; --amber:#f5a524; --amber-ink:#f5b54a; --amber-soft:#35290f;
  --green:#3cc39c; --green-soft:#11322a; --scrim:rgba(0,0,0,.62); --shadow:0 1px 2px rgba(0,0,0,.3);
  --c-done:#5f8fe0; --c-open:#ec5a4c;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 160px}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.eyebrow{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sync{font-size:12px;padding:1px 9px;border-radius:99px;background:var(--line);color:var(--muted)}
.sync.cloud{background:var(--green-soft);color:var(--green)}
.top h1{font-size:32px;font-weight:700;line-height:1.15;letter-spacing:-.01em}
.top-act{display:flex;gap:10px;align-items:center}
.icon-btn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--ink)}
.icon-btn svg{width:22px;height:22px}
.orb{position:relative;width:62px;height:62px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 35%,var(--night-2),var(--night) 72%);
  box-shadow:0 0 0 2px var(--night),0 0 0 4px var(--gold),0 10px 28px rgba(176,138,79,.35)}
.orb svg{width:28px;height:28px;color:var(--gold-hi)}
.orb .dot{position:absolute;top:1px;right:1px;width:14px;height:14px;border-radius:50%;background:var(--red);border:2px solid var(--bg)}
.orb.live{animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 2px var(--night),0 0 0 9px var(--gold-hi),0 10px 40px rgba(220,192,141,.6)}}

/* calendar header */
.cal-top{margin-bottom:10px}
.month-btn{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:700;font-size:20px;padding:6px 12px 6px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.month-btn svg{width:18px;height:18px;color:var(--gold-ink)}
.acct-btn{font-family:var(--f-display);font-weight:700;font-size:17px;color:#1b1406;border:0;background:linear-gradient(135deg,var(--gold-hi),var(--gold))}
.week{display:flex;align-items:center;gap:4px;margin-bottom:14px}
.wk-nav{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.wk-nav svg{width:20px;height:20px}
.wk-days{flex:1;min-width:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;border-radius:16px;border:1px solid transparent;font-size:12px;color:var(--muted)}
.wd b{font-family:var(--f-display);font-size:19px;color:var(--ink);line-height:1.1}
.wd .mk{width:6px;height:6px;border-radius:50%;background:transparent}
.wd .mk.open{background:var(--gold)} .wd .mk.hot{background:var(--red)} .wd .mk.done{background:var(--line)}
.wd.today{border-color:var(--gold)}
.wd.sel{background:var(--night);border-color:var(--night);color:var(--night-ink)}
.wd.sel b{color:#fff}
.wd.sel .mk.done{background:rgba(255,255,255,.3)}
.day-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.day-head h1{font-size:30px;line-height:1.15}
.day-head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.t-age{font-size:12px;font-weight:600;color:var(--red-ink);background:var(--red-soft);border-radius:6px;padding:1px 7px}

/* month picker */
.mp-head{display:flex;align-items:center;gap:8px}
.mp-head select{flex:1;min-width:0;padding:10px 12px}
.mp-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.mp-grid .wh{font-size:12px;color:var(--muted);padding:4px 0}
.mp-day{aspect-ratio:1/1;max-width:100%;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--f-display);font-weight:600;font-size:16px;border:1px solid transparent}
.mp-day.today{border-color:var(--gold)}
.mp-day.sel{background:var(--night);color:#fff}
.mp-day .mk{width:6px;height:6px;border-radius:50%}
.mp-day .mk.open{background:var(--gold)} .mp-day .mk.hot{background:var(--red)} .mp-day .mk.done{background:var(--line)}

/* year overview */
.yr-switch{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:2px}
.yr-switch b{font-family:var(--f-display);font-size:17px;min-width:52px;text-align:center}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;min-width:0}
.kpi .k{font-size:13px;color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.2}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.hot{background:var(--night);border-color:var(--night);color:#fff}
.kpi.hot .k,.kpi.hot .s{color:var(--night-ink)}
.kpi.hot .v{color:#ff8a7e}
.vcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:14px;min-width:0}
.vcard h2{font-size:18px}
.vcard .sub{margin:2px 0 12px;color:var(--muted);font-size:13px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:11px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover{fill:color-mix(in srgb,var(--ink) 5%,transparent)}
.months{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 12px}
@media (max-width:520px){.months{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mcal h3{font-size:13px;font-family:var(--f-display);margin:0 0 4px}
.mini-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.hc{aspect-ratio:1/1;border-radius:3px;background:transparent;border:1px solid var(--line);padding:0}
.hc.pad{border:0}
.hc.l0{background:var(--line);border-color:var(--line)}
.hc.l1{background:color-mix(in srgb,var(--c-open) 35%,var(--card));border-color:transparent}
.hc.l2{background:color-mix(in srgb,var(--c-open) 65%,var(--card));border-color:transparent}
.hc.l3{background:var(--c-open);border-color:transparent}
.hc.today{outline:2px solid var(--gold);outline-offset:1px}
.hbar{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13.5px;margin-top:8px}
.hbar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .track{height:14px}
.hbar .fill{height:100%;border-radius:0 4px 4px 0;background:var(--c-open);min-width:2px}
.hbar .val{text-align:right;font-family:var(--f-display);font-weight:700}
.viz-tip{position:fixed;z-index:70;pointer-events:none;background:var(--night);color:#fff;font-size:13px;line-height:1.45;padding:8px 11px;border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.25);max-width:220px}
.viz-tip b{font-family:var(--f-display)}
details.tbl-view{margin-top:12px}
details.tbl-view summary{cursor:pointer;color:var(--gold-ink);font-weight:600;font-size:13.5px}
.dtable{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}
.dtable th,.dtable td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
.dtable th:first-child,.dtable td:first-child{text-align:left}
.dtable th{color:var(--muted);font-weight:600}
.mo-h{font-family:var(--f-display);font-weight:700;font-size:15px;margin:16px 0 8px;color:var(--muted)}

/* management */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:14px}
.seg button{padding:10px;border-radius:12px;font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--night);color:#fff}
.tm-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tm-tools{display:flex;gap:8px;align-items:center;margin:18px 0 10px}
.tm-tools h2{font-size:18px;flex:1}
.tm-tools input{max-width:190px;padding:9px 13px}
.member .role{font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 7px;background:var(--line);color:var(--ink)}
.member .role.admin{background:var(--gold-soft);color:var(--gold-ink)}
.m-acts{display:flex;gap:6px;flex-wrap:wrap;flex-basis:100%;padding-left:52px}
@media (max-width:380px){.m-acts{padding-left:0}}
.pwrow{display:flex;gap:8px}
.pwrow input{flex:1;min-width:0}
.pwrow .mini{align-self:center}
.setup{display:flex;flex-direction:column;gap:8px}
.setup ol{margin:0;padding-left:1.2em}

/* status strip */
.status{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 18px;border-radius:24px;color:#fff;
  background:radial-gradient(120% 120% at 100% 0%,rgba(220,192,141,.2),transparent 55%),linear-gradient(160deg,var(--night-2),var(--night));box-shadow:0 10px 30px rgba(14,21,36,.22)}
.st-main{display:flex;align-items:baseline;gap:8px;flex:1}
.st-main b{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1}
.st-main span{color:var(--gold-hi);font-weight:600}
.st-chips{display:flex;gap:6px;flex-wrap:wrap;min-width:0;order:3;flex-basis:100%}
.st-chip{font-size:13px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.1);color:var(--night-ink);white-space:nowrap}
.st-chip.hot{background:var(--red);color:#fff;font-weight:600}
.st-send{display:flex;align-items:center;gap:6px;padding:10px 16px;border-radius:99px;font-family:var(--f-display);font-weight:700;color:#1b1406;background:linear-gradient(135deg,var(--gold-hi),var(--gold))}
.st-send svg{width:17px;height:17px}

/* task list: one list, ordered by what to do first */
.group{margin-top:24px}
.group-h{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.group-h h2{font-size:19px;font-weight:700;display:flex;align-items:center;gap:8px}
.group-h .cnt{font-family:var(--f-display);font-size:13px;font-weight:700;min-width:24px;height:24px;padding:0 7px;border-radius:99px;display:inline-grid;place-items:center;background:var(--line);color:var(--ink)}
.group.now .cnt{background:var(--red);color:#fff}
.group.timed .cnt{background:var(--amber);color:#1b1406}
.group-h p{margin:0;color:var(--muted);font-size:13px}
.tasks{display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;position:relative}
.task::before{content:"";width:4px;flex:none;background:var(--line)}
.task.now::before{background:var(--red)} .task.timed::before{background:var(--amber)} .task.follow::before{background:var(--gold)} .task.info::before{background:var(--green)}
.task.done{opacity:.6;box-shadow:none}
.check{flex:none;width:54px;display:grid;place-items:center}
.check svg{width:30px;height:30px;padding:5px;border-radius:50%;border:2px solid var(--line);color:transparent;transition:all .15s}
.check:hover svg{border-color:var(--gold);color:var(--gold)}
.task.done .check svg{background:var(--green);border-color:var(--green);color:#fff}
.tb{flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;text-align:left;padding:12px 14px 12px 0}
.t-who{grid-column:1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.t-room{font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:0 8px}
.t-vip{font-size:11.5px;font-weight:700;color:var(--gold-ink);background:var(--gold-soft);border-radius:6px;padding:1px 6px}
.t-do{grid-column:1;font-size:16px;font-weight:600;line-height:1.4;color:var(--ink)}
.t-why{grid-column:1;font-size:13.5px;color:var(--muted);line-height:1.4}
.task.done .t-do{text-decoration:line-through;text-decoration-color:var(--muted)}
.t-time{grid-column:2;grid-row:1 / span 3;align-self:center;text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.t-time b{font-family:var(--f-display);font-size:20px;line-height:1.1}
.t-time small{font-size:12px;color:var(--muted);white-space:nowrap}
.t-time.late b,.t-time.late small{color:var(--red-ink)}
.t-time.soon small{color:var(--amber-ink);font-weight:600}
details.donebox{margin-top:24px}
details.donebox summary{cursor:pointer;list-style:none;font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--muted);display:flex;align-items:center;gap:8px}
details.donebox summary::-webkit-details-marker{display:none}
details.donebox summary::after{content:"แสดง";font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--gold-ink)}
details.donebox[open] summary::after{content:"ซ่อน"}
details.donebox .tasks{margin-top:10px}
.empty{color:var(--muted);text-align:center;padding:34px 10px}
.empty b{display:block;font-family:var(--f-display);font-size:20px;color:var(--ink);margin-bottom:4px}
.exbar{margin-top:14px;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.exbar button{color:var(--gold-ink);font-weight:600}

/* login */
body.locked .nav{display:none}
.login{min-height:calc(100vh - 60px);display:flex;flex-direction:column;justify-content:center;gap:24px;max-width:420px;margin:0 auto;padding-block:24px}
.login-brand{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.login-brand .orb{width:76px;height:76px}
.login-brand .orb svg{width:34px;height:34px}
.login-brand h1{font-size:30px}
.login-brand p{margin:0;color:var(--muted)}
.form{display:flex;flex-direction:column;gap:14px}
.login-card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow)}
.pw{position:relative}
.pw input{padding-right:70px}
.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:13px;font-weight:600;color:var(--gold-ink);padding:6px 8px}
.link{color:var(--gold-ink);font-weight:600;font-size:14px;align-self:center;padding:4px}
input[type=date]{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 15px}
input[type=email]{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 15px}

/* bell + inbox */
.top-act{display:flex;gap:10px;align-items:center}
.icon-btn{position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--ink)}
.icon-btn svg{width:22px;height:22px}
.badge{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--red);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}
.noti{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.noti.new{border-color:var(--green);background:color-mix(in srgb,var(--green-soft) 55%,var(--card))}
.noti-ic svg{width:28px;height:28px;padding:5px;border-radius:50%;background:var(--green);color:#fff}
.noti-t{display:flex;flex-direction:column;min-width:0;font-size:14px}
.noti-t b{font-family:var(--f-display);font-size:16px}
.noti-t small{color:var(--muted);font-size:12.5px;margin-top:2px}

/* account + team */
.acct{gap:12px}
.acct-row{display:flex;gap:12px;align-items:center}
.avatar{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:18px;color:#1b1406;background:linear-gradient(135deg,var(--gold-hi),var(--gold))}

(() => {
"use strict";
const CFG = Object.assign({ teamId: "fo", firebase: null }, window.JARVIS_CONFIG || {});

const CATS = [
  { id: "vip", name: "VIP & Arrival" },
  { id: "room", name: "ห้องพัก / Housekeeping" },
  { id: "complaint", name: "Complaint" },
  { id: "maint", name: "ซ่อมบำรุง" },
  { id: "billing", name: "Billing / Cashier" },
  { id: "lost", name: "Lost & Found" },
  { id: "other", name: "อื่น ๆ" },
];
const CAT_NAME = Object.fromEntries(CATS.map(c => [c.id, c.name]));
const PRI = { urgent: "ด่วน", follow: "ติดตาม", info: "แจ้งทราบ" };

const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;

const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const thDate = (s, o) => parseYmd(s).toLocaleDateString("th-TH", o);

// Demo only: a year of made-up history so the year overview has something to show.
function demoHistory() {
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const T = [
    ["maint", "follow", "แอร์ไม่เย็น", "ตามช่างและแจ้งแขกเวลาที่จะเข้าไป"], ["maint", "urgent", "น้ำไม่ไหลในห้องน้ำ", "ประสานช่างด่วน เสนอย้ายห้องถ้าเกิน 30 นาที"],
    ["room", "follow", "ขอ late check-out", "แจ้ง HK เลื่อนทำห้อง"], ["room", "follow", "ขอหมอนและผ้าห่มเพิ่ม", "ส่ง HK นำขึ้นห้อง"],
    ["vip", "urgent", "VIP มาถึงช่วงบ่าย", "ยืนยัน amenity และห้องพร้อมก่อนแขกถึง"], ["vip", "follow", "แขกครบรอบแต่งงาน", "ประสาน F&B จัดเค้ก"],
    ["complaint", "urgent", "เสียงดังจากห้องข้าง", "โทรตามแขกและแจ้ง Security"], ["complaint", "follow", "รอเช็กเอาต์นาน", "โทรขอโทษและเสนอ voucher"],
    ["billing", "follow", "มัดจำบัตรไม่ผ่าน", "ขอบัตรใหม่หรือเงินสด"], ["billing", "follow", "ขอแยกบิลค่าอาหาร", "ทำบิลแยกก่อนเช็กเอาต์"],
    ["lost", "info", "พบโทรศัพท์ที่ล็อบบี้", "ลงบันทึก L&F"], ["other", "info", "ระบบ key card ปิดปรับปรุงช่วงดึก", ""],
  ];
  const names = [["หัวหน้ากะ", "demo-history"], ["ออม", "demo-history"], ["บี", "demo-history"]];
  const out = [], now = new Date(), end = ymd(now);
  for (let d = new Date(now.getFullYear(), 0, 1); ymd(d) < end; d.setDate(d.getDate() + 1)) {
    const n = Math.floor(rnd() * 3) + (d.getDay() >= 5 ? 1 : 0);
    for (let k = 0; k < n; k++) {
      const t = T[Math.floor(rnd() * T.length)];
      const created = new Date(d); created.setHours(7 + Math.floor(rnd() * 14), Math.floor(rnd() * 60));
      const age = (now - d) / 864e5;
      const open = rnd() < (age < 45 ? 0.05 : 0.006);
      const who = names[Math.floor(rnd() * names.length)], closer = names[Math.floor(rnd() * names.length)];
      out.push({ id: "h" + out.length, room: String(3 + Math.floor(rnd() * 13)) + pad2(1 + Math.floor(rnd() * 24)), guest: "", cat: t[0], pri: t[1],
        summary: t[2], action: t[3], due: "", dueDate: ymd(d), done: !open, ex: true, createdAt: +created, by: who[0], byUid: who[1],
        doneBy: open ? "" : closer[0], doneByUid: open ? "" : closer[1], doneAt: open ? 0 : +created + (1 + rnd() * (t[1] === "urgent" ? 4 : 30)) * 36e5 });
    }
  }
  return out;
}

// ---------------- data store: local or Firestore ----------------
let ITEMS = [], BRIEFS = [];
const listeners = new Set();
const emit = () => listeners.forEach(f => f());

const LocalStore = (() => {
  const KEY = "jarvis-data-v4";
  let d = null;
  try { const raw = localStorage.getItem(KEY); if (raw) d = JSON.parse(raw); } catch (e) {}
  if (!d) d = { items: [...EXAMPLES, ...(window.JARVIS_DEMO_USERS ? demoHistory() : [])], briefs: [] };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} ITEMS = d.items; BRIEFS = d.briefs; emit(); };
  return {
    mode: "local",
    start() { ITEMS = d.items; BRIEFS = d.briefs; emit(); },
    async addItems(list) { d.items = [...list, ...d.items]; save(); },
    async updateItem(id, patch) { d.items = d.items.map(i => i.id === id ? { ...i, ...patch } : i); save(); },
    async deleteItem(id) { d.items = d.items.filter(i => i.id !== id); save(); },
    async clearExamples() { d.items = d.items.filter(i => !i.ex); save(); },
    async yearItems(y) { return d.items.filter(i => itemDate(i).startsWith(y + "-")); },
    async addBrief(b) { const id = uid(); d.briefs = [{ id, ...b }, ...d.briefs].slice(0, 40); save(); return id; },
    async ackBrief(id, ack) { d.briefs = d.briefs.map(b => b.id === id ? { ...b, acks: [...(b.acks || []), ack] } : b); save(); },
    async patchBrief(id, patch) { d.briefs = d.briefs.map(b => b.id === id ? { ...b, ...patch } : b); save(); },
  };
})();

function toLogin(v) {
  v = String(v || "").trim().toLowerCase();
  if (!v || v.includes("@")) return v;
  return `${v}@${USER_DOMAIN}`;
}
const isUsername = v => /^[a-z0-9._-]{3,30}$/.test(String(v || "").trim().toLowerCase());
const showId = e => String(e || "").endsWith("@" + USER_DOMAIN) ? e.slice(0, -USER_DOMAIN.length - 1) : (e || "");

  v = String(v || "").trim();
  if (v.includes("@") ? !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) : !isUsername(v)) throw new Error("ชื่อผู้ใช้ใช้ a-z 0-9 . _ - ยาว 3–30 ตัว หรือใส่อีเมล");
  return toLogin(v);
}

async function sha256(t) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}

const Demo = {
  KEY: "jarvis-demo-users", SKEY: "jarvis-demo-session",
  users() { try { const r = localStorage.getItem(this.KEY); if (r) return JSON.parse(r); } catch (e) {} return (window.JARVIS_DEMO_USERS || []).map(u => ({ ...u })); },
  save(list) { try { localStorage.setItem(this.KEY, JSON.stringify(list)); } catch (e) {} },
  setSession(uid) { try { uid ? localStorage.setItem(this.SKEY, uid) : localStorage.removeItem(this.SKEY); } catch (e) {} },
  current() { let s = ""; try { s = localStorage.getItem(this.SKEY) || ""; } catch (e) {} return s ? this.users().find(u => u.uid === s && !u.disabled) || null : null; },
  async login(email, pass) {
    const e = email.trim().toLowerCase();
    const u = this.users().find(x => x.email === e);
    if (!u || u.hash !== await sha256(e + ":" + pass)) throw { code: "auth/invalid-credential" };
    if (u.disabled) throw { code: "auth/user-disabled" };
    this.setSession(u.uid);
    return u;
  },
};

let store = LocalStore;
let fb = null; // { auth, authM, db, fs, user }

async function startCloud() {
  if (AUTH !== "firebase") return;
  try {
    const V = "10.12.2";
    const [appM, authM, fs] = await Promise.all([
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`),
    ]);
    const app = appM.initializeApp(CFG.firebase);
    const auth = authM.getAuth(app);
    const db = fs.getFirestore(app);
    fb = { auth, authM, db, fs, user: null };
    loginReady(true);
    authM.onAuthStateChanged(auth, async user => {
      fb.user = user;
      if (!user) return setMe(null);
      let prof = {};
      try { const d = await fs.getDoc(fs.doc(db, "users", user.uid)); if (d.exists()) prof = d.data(); } catch (e) {}
      if (prof.disabled) { await authM.signOut(auth); return loginError("บัญชีนี้ถูกปิดการใช้งาน"); }
      useCloud();
      setMe({ uid: user.uid, email: user.email, name: prof.name || user.displayName || user.email.split("@")[0], role: prof.role || "staff" });
    });
  } catch (e) {
    console.warn("Firebase unavailable", e);
    loginError("เชื่อมต่อระบบไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วโหลดหน้าใหม่");
  }
}

let unsub = [];
function useCloud() {
  const { db, fs } = fb;
  const base = `teams/${CFG.teamId}`;
  const itemsCol = fs.collection(db, base, "items");
  const briefsCol = fs.collection(db, base, "briefs");
  unsub.forEach(u => u()); unsub = [];
  store = {
    mode: "cloud",
    start() {},
    async addItems(list) {
      const batch = fs.writeBatch(db);
      list.forEach(it => { const { id, ex, ...rest } = it; batch.set(fs.doc(itemsCol, id), rest); });
      await batch.commit();
    },
    updateItem: (id, patch) => fs.updateDoc(fs.doc(itemsCol, id), patch),
    deleteItem: id => fs.deleteDoc(fs.doc(itemsCol, id)),
    async clearExamples() {},
    async addBrief(b) { const id = uid(); await fs.setDoc(fs.doc(briefsCol, id), b); return id; },
    ackBrief: (id, ack) => fs.updateDoc(fs.doc(briefsCol, id), { acks: fs.arrayUnion(ack) }),
    patchBrief: (id, patch) => fs.updateDoc(fs.doc(briefsCol, id), patch),
  };
  store.yearItems = async y => {
    const snap = await fs.getDocs(fs.query(itemsCol, fs.where("dueDate", ">=", `${y}-01-01`), fs.where("dueDate", "<=", `${y}-12-31`)));
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  };
  const fail = e => { console.warn(e); toast(e.code === "permission-denied" ? "บัญชีนี้ยังไม่อยู่ในทีม ให้ผู้ดูแลเพิ่มก่อน" : "เชื่อมต่อฐานข้อมูลไม่ได้"); };
  // Live: every open task, everything closed in the last 14 days, and the day on screen.
  const maps = { open: new Map(), recent: new Map(), day: new Map() };
  const merge = () => { const m = new Map(); for (const k of ["recent", "day", "open"]) for (const [id, v] of maps[k]) m.set(id, v); ITEMS = [...m.values()].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)); emit(); };
  const toMap = snap => new Map(snap.docs.map(d => [d.id, { id: d.id, ...d.data() }]));
  unsub.push(fs.onSnapshot(fs.query(itemsCol, fs.where("done", "==", false), fs.limit(1000)), snap => { maps.open = toMap(snap); merge(); }, fail));
  unsub.push(fs.onSnapshot(fs.query(itemsCol, fs.where("doneAt", ">=", Date.now() - 14 * 864e5), fs.limit(1000)), snap => { maps.recent = toMap(snap); merge(); }, fail));
  let dayUnsub = null;
  store.watchDay = day => {
    dayUnsub?.(); maps.day = new Map();
    dayUnsub = fs.onSnapshot(fs.query(itemsCol, fs.where("dueDate", "==", day)), snap => { maps.day = toMap(snap); merge(); }, fail);
  };
  unsub.push(() => dayUnsub?.());
  store.watchDay(SEL);
  unsub.push(fs.onSnapshot(fs.query(briefsCol, fs.orderBy("at", "desc"), fs.limit(40)),
    snap => { BRIEFS = snap.docs.map(d => ({ id: d.id, ...d.data() })); emit(); }, fail));
}

function setMe(u) {
  ME = u;
  if (!u && AUTH === "firebase") { unsub.forEach(f => f()); unsub = []; ITEMS = []; BRIEFS = []; }
  CHAT = [];
  showLogin(!u && AUTH !== "none");
  renderSync();
  emit();
}

async function api(path, body) {
  const headers = body === null ? {} : { "content-type": "application/json" };
  if (fb?.user) headers.authorization = "Bearer " + await fb.user.getIdToken();
  else if (P.pin) headers["x-team-pin"] = P.pin;

  if (!r.ok) throw new Error(j.error || "เซิร์ฟเวอร์ตอบ " + r.status);

}

// ---------------- voice: Claude dictation, Web Speech, or keyboard ----------------
let claudeDict = null, claudeSample = null;
(async () => {
  if (!window.claude?.use) return;
  try { claudeDict = await window.claude.use("dictation"); } catch (e) {}
  try { claudeSample = await window.claude.use("sample"); } catch (e) {}
  if (claudeDict) {
    claudeDict.onFinal(({ text }) => voice.onFinal(text));
    claudeDict.onPartial(({ text }) => voice.onPartial(text));
    claudeDict.onState(({ state, reason }) => {
      voice.setLive(state !== "idle");
      if (state === "idle" && reason === "not_granted") toast("ไมค์ถูกปิดไว้ พิมพ์แทนได้");
      if (state === "idle" && reason === "unavailable") { claudeDict = null; renderMicHint(); }
    });
  }
  renderMicHint();
})();

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const voice = {
  live: false, want: false, rec: null,
  available() { return !!(claudeDict || SR); },
  onFinal(text) { const ta = $("#note"); if (!ta) return; const t = String(text); ta.value = ta.value ? (ta.value.replace(/\s+$/, "") + " " + t.trim()) : t.trim(); const p = $("#partial"); if (p) p.textContent = ""; },
  onPartial(text) { const p = $("#partial"); if (p) p.textContent = text; },
  setLive(on) {
    this.live = on;
    document.querySelectorAll(".orb").forEach(o => o.classList.toggle("live", on));
    const z = $(".mic-zone"); if (z) z.classList.toggle("live-wave", on);
    const b = $("#micBtn"); if (b) { b.classList.toggle("live", on); b.setAttribute("aria-label", on ? "หยุดฟังแล้วส่ง" : "พูด"); }
  },
  start() { // must be called inside a click
    if (claudeDict) {
      claudeDict.start({ language: "th" }).catch(e => {
        if (e.code === "unavailable") claudeDict.start().catch(() => {});
        else if (e.code === "not_granted") toast("ไม่ได้รับอนุญาตใช้ไมค์ พิมพ์แทนได้");
      });
      return;
    }
    if (!SR) return;
    this.want = true;
    const rec = this.rec = new SR();
    rec.lang = "th-TH"; rec.continuous = true; rec.interimResults = true;
    rec.onresult = ev => {
      let interim = "";
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const r = ev.results[i];
        if (r.isFinal) this.onFinal(r[0].transcript); else interim += r[0].transcript;
      }
      this.onPartial(interim);
    };
    rec.onerror = e => { if (e.error === "not-allowed" || e.error === "service-not-allowed") { this.want = false; toast("เบราว์เซอร์ไม่อนุญาตไมค์ พิมพ์หรือใช้ไมค์ของคีย์บอร์ดแทน"); } };
    rec.onend = () => { if (this.want) { try { rec.start(); return; } catch (e) {} } this.setLive(false); };
    try { rec.start(); this.setLive(true); } catch (e) { this.setLive(false); }
  },
  async stop() {
    this.want = false;
    if (claudeDict?.active()) { await claudeDict.stop().catch(() => {}); return; }
    const rec = this.rec; this.rec = null;
    if (rec) await new Promise(res => {
      const t = setTimeout(res, 1500);
      rec.onend = () => { clearTimeout(t); res(); };
      try { rec.stop(); } catch (e) { clearTimeout(t); res(); }
    });
    this.setLive(false);
  },
};

let view = "home";
// When a task is due: its date plus HH:MM, or the end of its day.
function dueAt(it) {
  const d = parseYmd(itemDate(it));
  if (/^\d{1,2}:\d{2}$/.test(it.due || "")) { const [h, m] = it.due.split(":").map(Number); d.setHours(h, m, 0, 0); }
  else d.setHours(23, 59, 0, 0);
  return d;
}
// Minutes until due (negative = late). null when there is no time and the day has not passed.
function minsUntil(it) {
  if (!it.due && itemDate(it) >= TODAY()) return null;
  return Math.round((dueAt(it) - Date.now()) / 6e4);
}
function relTime(mins) {
  const a = Math.abs(mins);
  let t;
  if (a >= 1440) t = `${Math.floor(a / 1440)} วัน`;
  else { const h = Math.floor(a / 60), m = a % 60; t = h ? `${h} ชม.${m ? " " + m + " นาที" : ""}` : `${m} นาที`; }
  return mins < 0 ? `เลย ${t}` : mins === 0 ? "ถึงเวลาแล้ว" : `อีก ${t}`;
}
const sameDay = (t, day) => t && ymd(new Date(t)) === day;
const daysOld = it => Math.round((parseYmd(TODAY()) - parseYmd(itemDate(it))) / 864e5);

// Tasks shown for a day. Today also carries every open task from earlier days.
function dayItems(day) {
  const t = TODAY();
  return ITEMS.filter(i => itemDate(i) === day || (day === t && !i.done && itemDate(i) < t));
}
function dayMark(day) {
  const list = ITEMS.filter(i => itemDate(i) === day);
  if (!list.length) return "";
  const open = list.filter(i => !i.done);
  if (!open.length) return "done";
  return open.some(i => i.pri === "urgent" || (minsUntil(i) ?? 1) < 0) ? "hot" : "open";
}

// One order for the screen and the LINE summary.
function groupTasks(items, day = SEL) {
  const open = items.filter(i => !i.done);
  const due = i => { const m = minsUntil(i); return m === null ? 1e9 : m; };
  const byDue = (a, b) => due(a) - due(b);
  const carry = open.filter(i => itemDate(i) < day).sort((a, b) => itemDate(a).localeCompare(itemDate(b)));
  const rest0 = open.filter(i => !carry.includes(i));
  const now = rest0.filter(i => i.pri === "urgent" || (i.pri !== "info" && due(i) < 0)).sort(byDue);
  const rest = rest0.filter(i => !now.includes(i));
  return [
    { key: "now", title: "ทำทันที", hint: "ด่วนหรือเลยเวลาแล้ว", list: now },
    { key: "carry", title: "ค้างจากวันก่อน", hint: "ยังไม่ปิด เรียงจากเก่าสุด", list: carry },
    { key: "timed", title: "ตามเวลา", hint: "มีเวลากำหนด เรียงจากใกล้สุด", list: rest.filter(i => i.pri !== "info" && i.due).sort(byDue) },
    { key: "follow", title: "ติดตามให้จบ", hint: "ยังไม่มีเวลากำหนด", list: rest.filter(i => i.pri !== "info" && !i.due) },
    { key: "info", title: "แจ้งให้ทราบ", hint: "อ่านแล้วติ๊กได้เลย", list: rest.filter(i => i.pri === "info") },
  ];
}

function taskHtml(it, tone) {
  const m = minsUntil(it);
  const vip = /VIP/i.test(it.guest);
  const guest = (it.guest || "").replace(/\s*\(VIP\)\s*/i, "").trim();
  const head = it.action || it.summary;
  const why = it.action ? it.summary : "";
  const old = !it.done && itemDate(it) < TODAY() ? daysOld(it) : 0;
  const timeCls = m === null ? "" : m < 0 ? "late" : m <= 60 ? "soon" : "";
  const time = it.done
    ? `<div class="t-time"><small>${it.doneBy ? "ปิดโดย " + esc(it.doneBy) : "เสร็จแล้ว"}</small>${it.doneAt ? `<small>${esc(new Date(it.doneAt).toLocaleString("th-TH", sameDay(it.doneAt, TODAY()) ? { hour: "2-digit", minute: "2-digit" } : { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }))}</small>` : ""}</div>`
    : old ? `<div class="t-time late"><b class="num">${old}</b><small>วันที่ค้าง</small></div>`
    : it.due ? `<div class="t-time ${timeCls}"><b class="num">${esc(it.due)}</b><small>${relTime(m)}</small></div>` : "";
  return `<div class="task ${it.done ? "done" : tone}">
    <button class="check" data-check="${esc(it.id)}" aria-label="${it.done ? "เปิดงานนี้อีกครั้ง" : "ทำเสร็จแล้ว"}: ${esc(it.room)}" aria-pressed="${!!it.done}">${IC.check}</button>
    <button class="tb" data-id="${esc(it.id)}">
      <span class="t-who"><span class="t-room num">${esc(it.room || "—")}</span>${guest ? `<span>${esc(guest)}</span>` : ""}${vip ? '<span class="t-vip">VIP</span>' : ""}${old ? `<span class="t-age">จาก ${esc(thDate(itemDate(it), { day: "numeric", month: "short" }))}</span>` : ""}<span>${esc(CAT_NAME[it.cat] || "")}</span></span>
      <span class="t-do">${esc(head)}</span>
      ${why ? `<span class="t-why">${esc(why)}</span>` : ""}
      ${time}
    </button>
  </div>`;
}

  const cp = e.target.closest("[data-copy]"); if (cp) { const b = BRIEFS.find(x => x.id === cp.dataset.copy); if (b) copy(b.text); return; }

    if (b && (b.acks || []).some(a => a.name === myName())) return toast("คุณรับเวรนี้แล้ว");
    store.ackBrief(ak.dataset.ack, { name: myName(), uid: myUid(), at: Date.now(), via: "app" }).then(() => toast("บันทึกว่ารับเวรแล้ว"));

function toggleDone(id) {
  const it = ITEMS.find(i => i.id === id); if (!it) return;
  const prev = { done: !!it.done, doneBy: it.doneBy || "", doneByUid: it.doneByUid || "", doneAt: it.doneAt || 0 };
  const done = !it.done;
  store.updateItem(id, donePatch(done))
    .then(() => { toast(done ? `${it.room} เสร็จแล้ว${it.by && it.byUid !== myUid() ? " · แจ้ง " + it.by + " ให้แล้ว" : ""}` : `เปิด ${it.room} อีกครั้ง`, () => store.updateItem(id, prev)); if (done) afterClose(id); })
    .catch(e => toast("บันทึกไม่สำเร็จ: " + (e.code || e.message)));
}

const tip = (() => {
  const el = document.createElement("div"); el.className = "viz-tip"; el.hidden = true; document.body.append(el);
  return {
    show(html, x, y) { el.innerHTML = html; el.hidden = false; const r = el.getBoundingClientRect(); el.style.left = Math.min(Math.max(8, x - r.width / 2), innerWidth - r.width - 8) + "px"; el.style.top = Math.max(8, y - r.height - 12) + "px"; },
    hide() { el.hidden = true; },
  };
})();
function bindTips(root) {
  root.querySelectorAll("[data-tip]").forEach(n => {
    const on = e => { const r = n.getBoundingClientRect(); tip.show(n.dataset.tip, e.clientX ?? r.left + r.width / 2, e.clientY ?? r.top); };
    n.addEventListener("pointermove", on); n.addEventListener("pointerenter", on); n.addEventListener("pointerleave", () => tip.hide());
    n.addEventListener("focus", () => { const r = n.getBoundingClientRect(); tip.show(n.dataset.tip, r.left + r.width / 2, r.top); });
    n.addEventListener("blur", () => tip.hide());
  });
}

async function renderYear() {
  if (view !== "year" || mgmtTab !== "year") return;
  const y = YEAR, body = $("#yearBody");
  $("#yrLabel").textContent = y + 543;
  $("#yrNext").disabled = y >= new Date().getFullYear() + 1;
  let list;
  try { list = await store.yearItems(y); } catch (e) { body.innerHTML = `<p class="err">โหลดข้อมูลปีนี้ไม่ได้: ${esc(e.code || e.message)}</p>`; return; }
  if (y !== YEAR) return;
  const t = TODAY();
  const open = list.filter(i => !i.done), done = list.filter(i => i.done);
  const late = open.filter(i => itemDate(i) < t);
  const hrs = done.filter(i => i.doneAt && i.createdAt).map(i => (i.doneAt - i.createdAt) / 36e5);
  const avg = hrs.length ? hrs.reduce((a, b) => a + b, 0) / hrs.length : 0;
  const oldest = late.length ? Math.max(...late.map(daysOld)) : 0;

  // per month and per day
  const mon = Array.from({ length: 12 }, () => ({ done: 0, open: 0 }));
  const perDay = {};
  for (const i of list) {
    const d = itemDate(i), m = +d.slice(5, 7) - 1;
    mon[m][i.done ? "done" : "open"]++;
    const p = perDay[d] || (perDay[d] = { all: 0, open: 0 }); p.all++; if (!i.done) p.open++;
  }

  // KPI tiles
  let html = `<div class="kpis">
    <div class="kpi"><div class="k">งานทั้งปี</div><div class="v num">${list.length.toLocaleString("th-TH")}</div><div class="s">ทุกแผนก</div></div>
    <div class="kpi"><div class="k">ปิดแล้ว</div><div class="v num">${list.length ? Math.round(done.length / list.length * 100) : 0}%</div><div class="s">${done.length.toLocaleString("th-TH")} งาน</div></div>
    <div class="kpi hot"><div class="k">ยังค้าง</div><div class="v num">${open.length}</div><div class="s">${late.length ? `เลยกำหนด ${late.length} · นานสุด ${oldest} วัน` : "ไม่มีงานเลยกำหนด"}</div></div>
    <div class="kpi"><div class="k">เวลาปิดเฉลี่ย</div><div class="v num">${avg >= 24 ? (avg / 24).toFixed(1) : avg.toFixed(1)}</div><div class="s">${avg >= 24 ? "วัน" : "ชั่วโมง"} ต่องาน</div></div>
  </div>`;

  // Monthly stacked bars: closed (bottom) + still open (top)
  const W = Math.round(Math.max(320, Math.min(640, body.clientWidth - 38))), H = 210, L = 30, B = 22, Tp = 8, cw = (W - L) / 12, bw = Math.min(26, cw - 12);
  const max = Math.max(4, ...mon.map(m => m.done + m.open));
  const step = Math.ceil(max / 4 / 5) * 5 || 1, top = step * 4;
  const yv = v => Tp + (H - Tp - B) * (1 - v / top);
  let svg = "";
  for (let k = 0; k <= 4; k++) { const v = step * k, yy = yv(v); svg += `<line class="grid" x1="${L}" x2="${W}" y1="${yy}" y2="${yy}"/><text x="${L - 6}" y="${yy + 4}" text-anchor="end">${v}</text>`; }
  mon.forEach((m, k) => {
    const x = L + cw * k + (cw - bw) / 2;
    const y0 = yv(0), yd = yv(m.done), yo = yv(m.done + m.open);
    const r = 4;
    if (m.done) { const h = y0 - yd - (m.open ? 2 : 0); svg += m.open ? `<rect x="${x}" y="${yd + (m.open ? 2 : 0)}" width="${bw}" height="${Math.max(0, h)}" fill="var(--c-done)"/>` : `<path d="M${x},${y0} V${yd + r} q0,-${r} ${r},-${r} H${x + bw - r} q${r},0 ${r},${r} V${y0} Z" fill="var(--c-done)"/>`; }
    if (m.open) svg += `<path d="M${x},${yd} V${Math.min(yo + r, yd)} q0,-${r} ${r},-${r} H${x + bw - r} q${r},0 ${r},${r} V${yd} Z" fill="var(--c-open)"/>`;
    svg += `<text x="${L + cw * k + cw / 2}" y="${H - 6}" text-anchor="middle">${MONTHS[k]}</text>`;
    svg += `<rect class="hit" x="${L + cw * k}" y="${Tp}" width="${cw}" height="${H - Tp - B}" tabindex="0" data-month="${k}" data-tip="<b>${MONTHS[k]} ${y + 543}</b><br>ปิดแล้ว ${m.done} · ยังค้าง ${m.open}"><title>${MONTHS[k]}: ปิดแล้ว ${m.done}, ยังค้าง ${m.open}</title></rect>`;
  });
  html += `<div class="vcard"><h2>งานรายเดือน</h2><p class="sub">แตะเดือนเพื่อดูในปฏิทิน</p>
    <div class="legend"><span><i style="background:var(--c-done)"></i>ปิดแล้ว</span><span><i style="background:var(--c-open)"></i>ยังค้าง</span></div>
    <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="งานรายเดือน ปิดแล้วและยังค้าง">${svg}</svg></div>
    <details class="tbl-view"><summary>ดูเป็นตาราง</summary><table class="dtable"><tr><th>เดือน</th><th>ทั้งหมด</th><th>ปิดแล้ว</th><th>ยังค้าง</th></tr>
      ${mon.map((m, k) => `<tr><td>${MONTHS[k]}</td><td class="num">${m.done + m.open}</td><td class="num">${m.done}</td><td class="num">${m.open}</td></tr>`).join("")}</table></details></div>`;

  // Calendar heatmap of open tasks per day
  html += `<div class="vcard"><h2>ปฏิทินงานค้าง</h2><p class="sub">สีแดงเข้ม = ยังค้างหลายงานในวันนั้น แตะวันเพื่อเปิดดู</p>
    <div class="legend"><span><i style="border:1px solid var(--line)"></i>ไม่มีงาน</span><span><i style="background:var(--line)"></i>ปิดครบ</span><span><i class="l1" style="background:color-mix(in srgb,var(--c-open) 35%,var(--card))"></i>ค้าง 1</span><span><i style="background:color-mix(in srgb,var(--c-open) 65%,var(--card))"></i>2</span><span><i style="background:var(--c-open)"></i>3+</span></div>
    <div class="months">${Array.from({ length: 12 }, (_, m) => {
      const first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
      return `<div class="mcal"><h3>${new Date(y, m, 1).toLocaleDateString("th-TH", { month: "long" })}</h3><div class="mini-grid">${
        Array.from({ length: first }, () => '<span class="hc pad"></span>').join("") +
        Array.from({ length: days }, (_, k) => {
          const day = `${y}-${pad2(m + 1)}-${pad2(k + 1)}`, p = perDay[day];
          const lv = !p ? "" : p.open === 0 ? "l0" : p.open === 1 ? "l1" : p.open === 2 ? "l2" : "l3";
          const lab = `${thDate(day, { day: "numeric", month: "short" })}: ${p ? `งาน ${p.all} · ค้าง ${p.open}` : "ไม่มีงาน"}`;
          return `<button class="hc ${lv} ${day === t ? "today" : ""}" data-day="${day}" data-tip="${esc(lab)}" aria-label="${esc(lab)}"></button>`;
        }).join("")}</div></div>`;
    }).join("")}</div></div>`;

  // Open by department
  const byCat = CATS.map(c => ({ c, n: open.filter(i => i.cat === c.id).length })).filter(x => x.n).sort((a, b) => b.n - a.n);
  const cmax = Math.max(1, ...byCat.map(x => x.n));
  html += `<div class="vcard"><h2>งานค้างตามแผนก</h2><p class="sub">เฉพาะงานที่ยังไม่ปิดในปี ${y + 543}</p>
    ${byCat.length ? byCat.map(x => `<div class="hbar" data-tip="${esc(x.c.name)}: ค้าง ${x.n}"><span class="lbl">${esc(x.c.name)}</span><span class="track"><span class="fill" style="display:block;width:${x.n / cmax * 100}%"></span></span><span class="val num">${x.n}</span></div>`).join("") : `<p class="note">ไม่มีงานค้าง</p>`}</div>`;

  // Outstanding list, oldest first, by month
  const pend = open.slice().sort((a, b) => itemDate(a).localeCompare(itemDate(b)));
  html += `<div class="vcard"><h2>รายการงานค้าง <span class="cnt num">${pend.length}</span></h2><p class="sub">เรียงจากเก่าสุด แตะวงกลมเพื่อปิดงาน</p>`;
  let lastM = "";
  for (const it of pend.slice(0, 120)) {
    const mk = itemDate(it).slice(0, 7);
    if (mk !== lastM) { html += `<div class="mo-h">${thDate(mk + "-01", { month: "long", year: "numeric" })}</div>`; lastM = mk; }
    html += `<div class="tasks" style="margin-bottom:8px">${taskHtml(it, "now")}</div>`;
  }
  if (!pend.length) html += `<div class="empty"><b>ไม่มีงานค้างในปีนี้</b></div>`;
  if (pend.length > 120) html += `<p class="note">แสดง 120 งานแรก จากทั้งหมด ${pend.length} งาน</p>`;
  html += `</div>`;

  body.innerHTML = html;
  bindTips(body);
  body.querySelectorAll(".hc[data-day]").forEach(b => b.onclick = () => { tip.hide(); show("home"); setDay(b.dataset.day); });
  body.querySelectorAll("[data-month]").forEach(r => r.addEventListener("click", () => { tip.hide(); cur1(+r.dataset.month); }));
  function cur1(m) { show("home"); setDay(`${y}-${pad2(m + 1)}-01`); openMonthPicker(); }
}

const JARVIS_RULES = `คุณคือ Dusit Help ผู้ช่วยแผนก Front Office โรงแรม 5 ดาวในกรุงเทพฯ ผู้ใช้คุยกับคุณด้วยเสียงหรือพิมพ์ ภาษาไทยปนอังกฤษ ข้อความถอดเสียงอาจผิดบ้าง
คุณดูแลบอร์ดส่งเวร (JSON ด้านล่าง) และทำงานผ่าน actions:
- add: เพิ่มเรื่องใหม่ กรอก room guest cat pri summary action due (id เว้น "")
- update: แก้เรื่องที่มีอยู่ ใส่ id และเฉพาะฟิลด์ที่เปลี่ยน ฟิลด์อื่นเว้น ""
- close: ผู้ใช้บอกว่าเรื่องนั้นเสร็จ เรียบร้อย จัดการแล้ว ใส่ id
- reopen: เปิดเรื่องที่ปิดแล้วอีกครั้ง ใส่ id
- delete: ลบ เฉพาะเมื่อผู้ใช้สั่งลบหรือบอกว่าบันทึกผิดอย่างชัดเจน ใส่ id
- brief: ผู้ใช้ขอสรุปส่งไลน์ ส่งบรีฟ หรือส่งเวร id = "" คือทุกเรื่องที่ค้าง หรือใส่ id หลายตัวคั่นด้วยจุลภาค
หลักการ:
- จับคู่เรื่องจากเลขห้องและเนื้อหา ถ้าห้องเดียวมีหลายเรื่องที่ยังเปิดและไม่ชัดว่าหมายถึงเรื่องไหน ให้ถามกลับและไม่ทำ action
- ถ้าผู้ใช้แค่ถาม ให้ตอบจากบอร์ด และ actions เป็น []

const ACT_ICON = { add: "+", close: "✓", update: "✎", delete: "−", brief: "➤", miss: "!" };

function jarvisPayload() {
  const hist = [];
  for (const m of CHAT) {
    if (m.pending) continue;
    const done = (m.actions || []).filter(a => a.kind !== "miss" && !a.undone).map(a => a.label);
    const content = m.role === "assistant" && done.length ? `${m.content}\n[ทำแล้ว: ${done.join("; ")}]` : m.content;
    if (hist.length && hist[hist.length - 1].role === m.role) hist[hist.length - 1].content += "\n" + content;
    else hist.push({ role: m.role, content });
  }
  let messages = hist.slice(-12);
  while (messages.length && messages[0].role !== "user") messages = messages.slice(1);
  return {
    messages,
    board: [...new Map([...ITEMS.filter(i => !i.done), ...dayItems(SEL)].map(i => [i.id, i])).values()].slice(0, 200)
      .map(i => ({ id: i.id, room: i.room, guest: i.guest, cat: i.cat, pri: i.pri, summary: i.summary, action: i.action, date: itemDate(i), due: i.due, done: !!i.done })),
    today: TODAY(), selected: SEL,
    now: new Date().toLocaleString("th-TH", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }),
    name: myName(), hintCat,
  };
}
function jarvisPromptText(p) {

บทสนทนา (ข้อความล่าสุดอยู่ท้ายสุด):
${p.messages.map(m => (m.role === "user" ? "ผู้ใช้: " : "Dusit Help: ") + m.content).join("\n")}

ตอบเป็น JSON object เท่านั้น: {"reply": string, "actions": [{"type": "add|update|close|reopen|delete|brief", "id": string, "room": string, "guest": string, "cat": string, "pri": string, "summary": string, "action": string, "date": string, "due": string}]}`;

async function submitJarvis(text) {
  text = String(text || "").trim();
  if (!text || jvBusy) return;
  jvBusy = true;
  const note = $("#note"); if (note) { note.value = ""; note.style.height = "auto"; }
  if (voice.live) await voice.stop();
  if (note) note.value = "";
  CHAT.push({ role: "user", content: text });
  const bot = { role: "assistant", content: "", pending: true };
  CHAT.push(bot); drawChat();
  let res = null, err = "";
  try {
    const payload = jarvisPayload();
    if (claudeSample) res = await claudeSample.json(jarvisPromptText(payload), { modelTier: "default" });
    else if (SERVER.ai) res = await api("jarvis", payload);
  } catch (e) { err = e.message || "Claude ไม่ตอบ"; }
  if (!res || typeof res !== "object") res = localJarvis(text);
  bot.actions = await applyActions(Array.isArray(res.actions) ? res.actions : []);
  bot.content = String(res.reply || "").trim() || (bot.actions.length ? "เรียบร้อยครับ" : "ยังไม่เข้าใจครับ ลองบอกเลขห้องกับสิ่งที่ต้องทำอีกครั้ง");
  if (err) bot.content += `\n(${err} จึงใช้โหมดพื้นฐาน)`;
  bot.pending = false;
  CHAT = CHAT.slice(-40);
  jvBusy = false;
  drawChat();
}

function describe(patch) {
  const parts = [];
  if (patch.pri) parts.push(PRI[patch.pri]);
  if (patch.dueDate) parts.push(thDate(patch.dueDate, { day: "numeric", month: "short" }));
  if (patch.due) parts.push("ภายใน " + patch.due);
  if (patch.cat) parts.push(CAT_NAME[patch.cat]);
  if (patch.room) parts.push("ห้อง " + patch.room);
  if (patch.guest) parts.push(patch.guest);
  if (patch.summary) parts.push(patch.summary);
  if (patch.action) parts.push("→ " + patch.action);
  return parts.join(" · ");
}

async function applyActions(acts) {
  const out = [];
  for (const a of acts.slice(0, 20)) {
    const type = a?.type;
    const it = a?.id ? ITEMS.find(i => i.id === a.id) : null;
    try {
      if (type === "add") {
        const n = { ...normalize(a), createdAt: Date.now(), by: myName(), byUid: myUid() };
        await store.addItems([n]);
        out.push({ kind: "add", label: `เพิ่ม ${n.room} · ${PRI[n.pri]}${n.dueDate !== TODAY() ? " · " + thDate(n.dueDate, { day: "numeric", month: "short" }) : ""}${n.due ? " " + n.due : ""} · ${n.summary}`, undo: () => store.deleteItem(n.id) });
      } else if (type === "brief") {
        const ids = String(a.id || "").split(",").map(s => s.trim()).filter(Boolean);
        const list = ids.length ? ITEMS.filter(i => ids.includes(i.id)) : dayItems(SEL).filter(i => !i.done);
        if (!list.length) { out.push({ kind: "miss", label: "ไม่มีเรื่องค้างให้ส่ง" }); continue; }
        out.push({ kind: "brief", label: `สรุป ${list.length} งาน พร้อมส่งไลน์`, brief: { ids: list.map(i => i.id), title: ids.length ? "อัปเดตระหว่างวัน" : "สรุปประจำวัน" } });
      } else if (!it) {
        out.push({ kind: "miss", label: `ไม่พบเรื่อง${a?.room ? "ห้อง " + a.room : ""}บนบอร์ด` });
      } else if (type === "close" || type === "reopen") {
        const done = type === "close";
        if (!!it.done === done) { out.push({ kind: "miss", label: `${it.room} ${done ? "ปิดไปแล้ว" : "ยังเปิดอยู่"}` }); continue; }
        const prev = { done: !!it.done, doneBy: it.doneBy || "", doneByUid: it.doneByUid || "", doneAt: it.doneAt || 0 };
        await store.updateItem(it.id, donePatch(done));
        if (done) afterClose(it.id);
        out.push({ kind: done ? "close" : "update", label: `${done ? "ปิด" : "เปิดใหม่"} ${it.room} · ${it.summary}`, undo: () => store.updateItem(it.id, prev) });
      } else if (type === "update") {
        const n = normalize(a), patch = {};
        for (const k of ["room", "guest", "summary", "action"]) if (a[k]) patch[k] = n[k];
        if (CAT_NAME[a.cat]) patch.cat = a.cat;
        if (PRI[a.pri]) patch.pri = a.pri;
        if (a.due && n.due) patch.due = n.due;
        if (isYmd(a.date)) patch.dueDate = a.date;
        if (!Object.keys(patch).length) continue;
        const prev = Object.fromEntries(Object.keys(patch).map(k => [k, it[k] ?? ""]));
        await store.updateItem(it.id, patch);
        out.push({ kind: "update", label: `แก้ ${it.room}: ${describe(patch)}`, undo: () => store.updateItem(it.id, prev) });
      } else if (type === "delete") {
        const keep = { ...it };
        await store.deleteItem(it.id);
        out.push({ kind: "delete", label: `ลบ ${it.room} · ${it.summary}`, undo: () => store.addItems([keep]) });
      }
    } catch (e) {
      out.push({ kind: "miss", label: "ทำไม่สำเร็จ: " + (e.code || e.message) });
    }
  }
  return out;
}

// Works without AI: a few common commands, otherwise treat the text as new items.
function localJarvis(text) {
  const rooms = [...text.matchAll(/\d{3,4}/g)].map(m => m[0]);
  const open = ITEMS.filter(i => !i.done);
  const firstOpen = r => open.find(i => i.room === r);
  if (/สรุป|ส่ง\s*(บรีฟ|เวร|ไลน์|line)|บรีฟ/i.test(text) && !/อะไร|บ้าง|กี่/.test(text)) return { reply: "สรุปให้แล้วครับ แตะ “ดูและส่ง”", actions: [{ type: "brief", id: "" }] };
  if (rooms.length && /เสร็จ|เรียบร้อย|ปิด|จบ|แก้แล้ว|done/i.test(text)) {
    const acts = rooms.map(firstOpen).filter(Boolean).map(i => ({ type: "close", id: i.id }));
    return { reply: acts.length ? `ปิดเรื่องห้อง ${acts.map(a => ITEMS.find(i => i.id === a.id).room).join(", ")} แล้วครับ` : "ไม่พบเรื่องที่ยังเปิดอยู่ของห้องนี้ครับ", actions: acts };
  }
  const pm = text.match(/(ด่วน|ติดตาม|แจ้งทราบ)/);
  if (rooms.length && pm && /เปลี่ยน|ปรับ|เป็น/.test(text)) {
    const pri = { "ด่วน": "urgent", "ติดตาม": "follow", "แจ้งทราบ": "info" }[pm[1]];
    const acts = rooms.map(firstOpen).filter(Boolean).map(i => ({ type: "update", id: i.id, pri }));
    return { reply: acts.length ? "ปรับให้แล้วครับ" : "ไม่พบห้องนี้บนบอร์ดครับ", actions: acts };
  }
  if (/อะไร|บ้าง|กี่|สรุป|\?/.test(text)) {
    const urgentOnly = /ด่วน/.test(text);
    const list = (urgentOnly ? open.filter(i => i.pri === "urgent") : open).sort((a, b) => ORDER[a.pri] - ORDER[b.pri]).slice(0, 10);
    return { reply: list.length ? `${urgentOnly ? "เรื่องด่วน" : "เรื่องค้าง"} ${list.length} เรื่องครับ\n` + list.map(i => `• ${i.room} ${i.summary}${i.due ? " (ภายใน " + i.due + ")" : ""}`).join("\n") : "ไม่มีเรื่องค้างครับ", actions: [] };
  }
  const adds = heuristic(text.replace(/^[^:]{1,30}:\s*/, ""), hintCat).map(x => ({ type: "add", ...x }));
  return { reply: `เพิ่ม ${adds.length} เรื่องลงบอร์ดแล้วครับ`, actions: adds };
}

function normalize(x) {
  return {
    id: uid(), room: String(x.room || "—").slice(0, 10), guest: String(x.guest || "").slice(0, 40),
    cat: CAT_NAME[x.cat] ? x.cat : "other", pri: PRI[x.pri] ? x.pri : "follow",
    summary: String(x.summary || "").slice(0, 300), action: String(x.action || "").slice(0, 300),
    due: /^\d{1,2}:\d{2}$/.test(x.due || "") ? x.due.padStart(5, "0") : "", done: false,
    dueDate: isYmd(x.date) ? x.date : isYmd(x.dueDate) ? x.dueDate : SEL,
  };
}
function heuristic(text, cat) {
  const parts = text.split(/\n+|แล้วก็|อีกเรื่อง|ต่อมา|นอกจากนี้|(?=ห้อง\s*\d{3,4})/).map(s => (s || "").trim()).filter(s => s.length > 3);
  return (parts.length ? parts : [text]).map(p => {
    const room = (p.match(/(\d{3,4})/) || [])[1] || "—";
    let c = cat || "other";
    if (!cat) {
      if (/vip|arrival|มาถึง|เช็คอิน|check.?in/i.test(p)) c = "vip";
      else if (/ร้องเรียน|complain|ไม่พอใจ|บ่น|โวย/i.test(p)) c = "complaint";
      else if (/ซ่อม|แอร์|รั่ว|ไฟดับ|ช่าง|เสีย/i.test(p)) c = "maint";
      else if (/บิล|มัดจำ|เงิน|บัตร|จ่าย|deposit|bill/i.test(p)) c = "billing";
      else if (/ของหาย|ลืม|lost|found|เก็บได้/i.test(p)) c = "lost";
      else if (/late|แม่บ้าน|ทำความสะอาด|upgrade|ห้อง/i.test(p)) c = "room";
    }
    const pri = /ด่วน|ทันที|รีบ|ไม่พอใจ|โวย|urgent/i.test(p) ? "urgent" : /แจ้งไว้|ให้ทราบ/.test(p) ? "info" : "follow";
    const due = p.match(/\b(\d{1,2})[:.](\d{2})\b/);
    return { room, guest: "", cat: c, pri, summary: p.replace(/^(ห้อง)?\s*\d{3,4}\s*/, "").slice(0, 160), action: "", due: due ? `${due[1]}:${due[2]}` : "" };
  });
}

// ---------------- brief ----------------
function buildBrief(items, title) {
  const groups = groupTasks(items);
  const nowN = groups[0].list.length, carryN = groups[1].list.length;
  const ICON = { now: "🔴", carry: "⏳", timed: "🟠", follow: "🟡", info: "🟢" };
  let t = `📋 สรุปงาน FO · ${thDate(SEL, { weekday: "short", day: "numeric", month: "short", year: "numeric" })} · ${title}\n`;
  t += nowN || carryN ? `⚠️ ${[nowN ? `ทำทันที ${nowN}` : "", carryN ? `ค้างจากวันก่อน ${carryN}` : ""].filter(Boolean).join(" · ")} · ทั้งหมด ${items.length} งาน\n` : `ไม่มีงานด่วน · ทั้งหมด ${items.length} งาน\n`;
  for (const g of groups) {
    if (!g.list.length) continue;
    t += `\n${ICON[g.key]} ${g.title} (${g.list.length})\n`;
    for (const it of g.list) {
      const carry = itemDate(it) < SEL ? ` · ค้างจาก ${thDate(itemDate(it), { day: "numeric", month: "short" })}` : "";
      t += `• ${it.room}${it.guest ? " " + it.guest : ""}${it.due ? " · " + it.due : ""}${carry}\n   ${it.action || it.summary}\n`;
      if (it.action && it.summary) t += `   (${it.summary})\n`;
    }
  }
  t += `\nผู้ส่ง: ${myName() || "-"}\nรับเวรแล้วตอบ "รับ" ในกลุ่มนี้ด้วยครับ`;
  return t;
}

function copy(t) {
  const ok = () => toast("คัดลอกแล้ว วางในกลุ่ม LINE ได้เลย");
  const fallback = () => {
    const pre = $("#briefTxt") || document.querySelector("details[open] pre.brief");
    if (pre) { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("เลือกข้อความให้แล้ว กดคัดลอกเอง"); }
    else toast("คัดลอกไม่ได้ในเบราว์เซอร์นี้");
  };
  try { navigator.clipboard.writeText(t).then(ok, fallback); } catch (e) { fallback(); }
}

function randomPassword() {
  const abc = "abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789";
  const a = new Uint32Array(10); crypto.getRandomValues(a);
  return [...a].map(n => abc[n % abc.length]).join("");
}

      if (b.dataset.act === "pw") {
        if (row.querySelector(".pw-inline")) return;
        row.insertAdjacentHTML("beforeend", `<form class="pw-inline"><input type="text" placeholder="รหัสใหม่ อย่างน้อย 6 ตัว" aria-label="รหัสผ่านใหม่ของ ${esc(u.name)}" autocomplete="off"><button class="mini" type="button" data-gen>สุ่ม</button><button class="mini gold" type="submit">บันทึก</button></form>`);
        const f = row.querySelector(".pw-inline"), inp = f.querySelector("input");
        inp.focus();
        f.querySelector("[data-gen]").onclick = () => { inp.value = randomPassword(); };
        f.onsubmit = async ev => { ev.preventDefault(); try { await Team.setPassword(id, inp.value); toast(`ตั้งรหัสใหม่ให้ ${u.name} แล้ว`); f.remove(); } catch (x) { toast(x.message); } };
        return;
      }
      if (b.dataset.act === "remove" && b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = "ยืนยันปิดบัญชี"; return; }
      b.disabled = true;
      if (b.dataset.act === "remove") { await Team.remove(id); toast(`ปิดบัญชี ${u.name} แล้ว`); }
      if (b.dataset.act === "enable") { await Team.enable(id); toast(`เปิดใช้ ${u.name} อีกครั้งแล้ว`); }
      if (b.dataset.act === "role") { const r = u.role === "admin" ? "staff" : "admin"; await Team.setRole(id, r); toast(`${u.name} เป็น${r === "admin" ? "ผู้ดูแล" : "พนักงาน"}แล้ว`); }
      load();
    } catch (x) { b.disabled = false; toast(x.message || "ทำไม่สำเร็จ"); }
  });
  $("#addForm").addEventListener("submit", async e => {
    e.preventDefault();
    const err = m => { $("#mErr").textContent = m; $("#mErr").hidden = !m; };
    const btn = $("#mAdd"); btn.disabled = true;
    try {
      const m = { name: $("#mName").value.trim(), email: checkId($("#mEmail").value), password: $("#mPass").value, role: $("#mRole").value };
      await Team.add(m);
      err(""); toast(`สร้างบัญชี ${m.name} แล้ว`); ["mName", "mEmail", "mPass"].forEach(id => $("#" + id).value = ""); load();
    } catch (x) { err(x.message || "สร้างไม่สำเร็จ"); }
    btn.disabled = false;
  });
  load();
}

// ---------------- boot ----------------
store.start();
renderSync();
if (AUTH === "demo") { const u = Demo.current(); setMe(u ? { uid: u.uid, email: u.email, name: u.name, role: u.role } : null); }
else if (AUTH === "firebase") { showLogin(true); loginReady(false); startCloud(); }
else checkNotifs();
if ("serviceWorker" in navigator && location.protocol === "https:" && !location.hostname.endsWith("claude.ai") && !location.hostname.endsWith("claudeusercontent.com")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
})();
</script>
</body>
</html>
